# Questmaster enforced tmux settings (enforced v1). Generated by Questmaster and
# rewritten before every start of its server; do not edit. Loaded after
# questmaster.conf, so these win.
set -g @questmaster_root "<sha256 of the absolute state root>"
set -g @questmaster_enforced 1
set -s exit-empty off
set -s exit-unattached off
set -g destroy-unattached off
set -g detach-on-destroy on
