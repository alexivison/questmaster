name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Verify tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 10m ./...

  tmux-integration:
    name: tmux integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QUESTMASTER_TMUX_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi

      - name: Log tmux version
        run: tmux -V

      - name: Test
        run: go test -v -count=1 -timeout 10m -run '^TestIntegration' ./...

  native-app:
    name: Native App
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: swift build -c release --package-path app --product Questmaster

      - name: Run app logic tests
        run: swift run --package-path app QuestmasterLogicTests
