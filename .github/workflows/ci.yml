name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Verify tidy
        run: git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 10m ./...

  tmux-integration:
    name: tmux integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QUESTMASTER_TMUX_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi

      - name: Log tmux version
        run: tmux -V

      - name: Test
        run: go test -v -count=1 -timeout 10m -run '^TestIntegration' ./...

  native-app:
    name: Native App
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-swiftpm-artifacts-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if swift package resolve --package-path app; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Swift package resolution failed after 3 attempts"
              exit 1
            fi
            echo "Swift package resolution attempt $attempt failed; retrying in $((attempt * 10)) seconds"
            sleep "$((attempt * 10))"
          done

      - name: Build app
        run: swift build -c release --package-path app --product Questmaster

      - name: Run app logic tests
        run: swift run --package-path app QuestmasterLogicTests

  bundle:
    name: App Bundle
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the git describe version stamp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install script tests
        run: app/Scripts/test-install.sh

      - name: Cache SwiftPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: ${{ runner.os }}-swiftpm-artifacts-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}

      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if swift package resolve --package-path app; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Swift package resolution failed after 3 attempts"
              exit 1
            fi
            echo "Swift package resolution attempt $attempt failed; retrying in $((attempt * 10)) seconds"
            sleep "$((attempt * 10))"
          done

      - name: Build Swift packages
        run: swift build -c release --package-path app --product Questmaster

      # HOME, the state root and the install path are all temporary, as on a developer's machine:
      # the script refuses a mix, and --isolated skips LaunchServices and the daemon nudge.
      - name: Build and install the bundle
        run: |
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/Applications"
          HOME="$RUNNER_TEMP/home" QUESTMASTER_STATE_ROOT="$RUNNER_TEMP/state" \
            app/Scripts/build-app.sh --install-path "$RUNNER_TEMP/Applications/Questmaster.app" --isolated

      - name: Check the installed bundle
        run: |
          app="$RUNNER_TEMP/Applications/Questmaster.app"
          want="$(git describe --tags --always --dirty --match 'v[0-9]*')"
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          qm="$(QUESTMASTER_STATE_ROOT="$RUNNER_TEMP/state" "$RUNNER_TEMP/state/bin/current/qm" version --json | plutil -extract version raw -o - -)"
          echo "git describe $want, Info.plist $plist, stable qm $qm"
          [ "$plist" = "$want" ] && [ "$qm" = "$want" ]
          skills="$(HOME="$RUNNER_TEMP/home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/home/.claude" QUESTMASTER_STATE_ROOT="$RUNNER_TEMP/state" "$RUNNER_TEMP/state/bin/current/qm" skills status)"
          printf '%s\n' "$skills" | grep -Fq questmaster-watch-pr
          printf '%s\n' "$skills" | grep -Fq questmaster-write-quest
          codesign --verify --deep --strict "$app"
